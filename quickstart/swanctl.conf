# Include config snippets
include conf.d/*.conf

conn-defaults 
{
  unique = replace
  reauth_time = 0
  version = 2
  mobike = no
  proposals = aes128-sha256-x25519
}

child-defaults 
{
  esp_proposals = aes256gcm16-modp2048-ke1_soft_hsm-esn
  mode = transport
  policies_fwd_out = yes
  start_action = start
}

connections 
{
  tun-1 : conn-defaults
  {
    local_addrs  = 0.0.0.0/0
    remote_addrs = 192.168.225.22
    local 
    {
      auth = psk
      id = 192.168.225.23
    }
    remote 
    {
      auth = psk
      id = 192.168.225.22
    }
    children 
    {
      tun-in-1 : child-defaults 
      {
        local_ts = 192.168.225.23/24 [udp/4789]
        remote_ts = 192.168.225.22/24 [udp]
      }
      tun-out-1 : child-defaults 
      {
        local_ts = 192.168.225.23/24 [udp]
        remote_ts = 192.168.225.22/24 [udp/4789]
      }
    }
  }
}

secrets 
{
  ike-tun 
  {
    id = 192.168.225.23
    secret = abcd
  }
}
